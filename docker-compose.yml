version: '3.8'

services:
  ai-plot-layout:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_plot_layout_prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:////app/data/app.db
      - UPLOAD_DIR=/app/uploads
      - OUTPUT_DIR=/app/outputs
      # Optional: set OPENROUTER_API_KEY or GEMINI_API_KEY for cloud vision enhancement
      # - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - ai_plot_data:/app/data
      - ai_plot_uploads:/app/uploads
      - ai_plot_outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ai_plot_data:
  ai_plot_uploads:
  ai_plot_outputs:
